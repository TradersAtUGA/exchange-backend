# this is for the server/gateway/exchange

[DEFAULT]
ConnectionType=acceptor
BeginString=FIX.4.4
HeartBtInt=30
FileStorePath=store
FileLogPath=log
UseDataDictionary=Y
DataDictionary=build/vcpkg_installed/x64-linux/share/quickfix/FIX44.xml
StartTime=00:00:00
EndTime=23:59:59
StartDay="monday"
EndDay="friday"
LogonDay="monday"
LogoutDay="friday"
LogonTime=00:00:00
LogoutTime=23:59:59

[SESSION]
SenderCompID=EXCHANGE1
# make sure the client exchange backend is also using this nickname in its .cfg file 
TargetCompID=BROKER1 
# also if running in dockerfile make sure to expose this port 
SocketAcceptPort=5001
SocketConnectPort=127.0.0.1 